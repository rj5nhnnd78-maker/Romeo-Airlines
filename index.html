<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romeo Airlines | Book a Flight</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#333;
}

.header{
  height:70px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #eee;
}

.logo{
  font-size:26px;
  font-weight:bold;
  color:#071a33;
}

.booking{
  max-width:900px;
  margin:35px auto;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title .small{
  color:#aaa;
  letter-spacing:8px;
  font-size:14px;
  font-weight:bold;
}

.title h1{
  font-family:Georgia,serif;
  font-size:48px;
  margin:12px 0;
  color:#333;
}

.title p{
  font-size:20px;
  line-height:1.6;
  color:#555;
  max-width:760px;
  margin:auto;
}

.card{
  background:white;
  border-radius:18px;
  padding:0 28px 30px;
  box-shadow:0 4px 25px rgba(0,0,0,.08);
}

.tabs{
  display:flex;
  border-bottom:1px solid #ddd;
  margin:0 -28px 25px;
}

.tab{
  flex:1;
  text-align:center;
  padding:22px 10px;
  font-size:19px;
  cursor:pointer;
  color:#555;
}

.tab.active{
  color:#3566c8;
  font-weight:bold;
  border-bottom:4px solid #3566c8;
}

.login{
  font-size:18px;
  margin:20px 0 28px;
  color:#555;
  text-decoration:underline;
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field{
  background:white;
  border:2px solid #ddd;
  border-radius:15px;
  padding:15px 18px;
}

.field.full{
  grid-column:1 / -1;
}

.field label{
  display:block;
  color:#777;
  font-size:15px;
  margin-bottom:8px;
}

.field input,
.field select{
  width:100%;
  border:0;
  outline:0;
  font-size:19px;
  color:#333;
  background:white;
}

.date-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.search{
  width:100%;
  margin-top:25px;
  padding:18px;
  border:0;
  border-radius:12px;
  background:#c92f2f;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.search:hover{
  background:#aa2424;
}

@media(max-width:650px){

  .booking{
    margin:15px auto;
  }

  .title h1{
    font-size:38px;
  }

  .title p{
    font-size:17px;
    padding:0 15px;
  }

  .card{
    border-radius:14px;
    padding:0 18px 25px;
  }

  .tabs{
    margin-left:-18px;
    margin-right:-18px;
  }

  .tab{
    font-size:16px;
  }

  .fields{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .date-row{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">ROMEO AIRLINES</div>
</header>

<section class="booking">

  <div class="title">
    <div class="small">BOOK</div>

    <h1>Book a flight</h1>

    <p>
      Search for Romeo Airlines flights and book online.
      Discover our routes, schedules, and the experience
      you can look forward to on board.
    </p>
  </div>

  <div class="card">

    <div class="tabs">

      <div class="tab active" onclick="setTrip('return',this)">
        Return
      </div>

      <div class="tab" onclick="setTrip('oneway',this)">
        One way
      </div>

      <div class="tab" onclick="setTrip('multi',this)">
        Multi-city
      </div>

    </div>

    <div class="login">
      👤 Log in to book Romeo Rewards ›
    </div>

    <div class="fields">

      <div class="field">
        <label>Departure airport</label>
        <input
          type="text"
          placeholder="From">
      </div>

      <div class="field">
        <label>Arrival airport</label>
        <input
          type="text"
          placeholder="To">
      </div>

      <div class="field full">

        <label>Travel dates</label>

        <div class="date-row">

          <input
            type="date"
            id="departure">

          <input
            type="date"
            id="return">

        </div>

      </div>

      <div class="field">

        <label>Passengers</label>

        <select>
          <option>1 Adult</option>
          <option>2 Adults</option>
          <option>3 Adults</option>
          <option>4 Adults</option>
          <option>5 Adults</option>
          <option>6 Adults</option>
          <option>7 Adults</option>
          <option>8 Adults</option>
          <option>9 Adults</option>
        </select>

      </div>

      <div class="field">

        <label>Class</label>

        <select>
          <option>Economy Class</option>
          <option>Premium Economy</option>
          <option>Business Class</option>
          <option>First Class</option>
        </select>

      </div>

      <div class="field full">

        <label>Promotional code</label>

        <input
          type="text"
          placeholder="Enter promotional code">

      </div>

    </div>

    <button class="search" onclick="searchFlights()">
      Search flights
    </button>

  </div>

</section>

<script>

function setTrip(type,element){

  document.querySelectorAll('.tab')
    .forEach(tab => tab.classList.remove('active'));

  element.classList.add('active');

  const returnDate = document.getElementById('return');

  if(type === 'oneway'){
    returnDate.style.display = 'none';
  }else{
    returnDate.style.display = 'block';
  }

}

function searchFlights(){

  const from = document.querySelector(
    'input[placeholder="From"]'
  ).value;

  const to = document.querySelector(
    'input[placeholder="To"]'
  ).value;

  if(!from || !to){

    alert("Please enter your departure and arrival airports.");

    return;
  }

  alert(
    "Searching Romeo Airlines flights from "
    + from
    + " to "
    + to
    + "..."
  );

}

</script>

</body>
</html>
